<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方向B：极简线条风 - ClipClop Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 极简线条风配色 - 压缩背景层次，强化边框 */
      --bg-shell: #1a1c1e;
      --bg-raised: #1a1c1e;
      --bg-hover: rgba(255,255,255,0.04);
      --bg-selected: rgba(255,255,255,0.08);
      --hairline: #3a3d42;
      --hairline-thick: 2px;
      --text-1: #ecedee;
      --text-2: #aeb3b7;
      --text-3: #8a9095;
      --action: #ffffff;
      --action-hover: #f0f0f0;
      --action-on: #1a1c1e;
      --danger: #ff6b72;

      /* 保守圆角 */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 14px;

      --mono: "SF Mono", "Cascadia Mono", ui-monospace, Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      font-family: var(--sans);
      background: #0a0a0a;
      color: var(--text-1);
      padding: 40px;
      min-height: 100vh;
      display: flex;
      gap: 20px;
    }

    .demo-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--text-2);
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* QuickPanel Demo */
    .quick-panel {
      background: var(--bg-raised);
      border-radius: var(--radius-xl);
      border: 2px solid var(--hairline);
      padding: 10px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      border-bottom: 2px solid var(--hairline);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand svg {
      width: 20px;
      height: 20px;
    }

    .brand strong {
      font-size: 12px;
      font-weight: 650;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-3);
      font-family: var(--mono);
      font-size: 11px;
    }

    .page-dots {
      display: flex;
      gap: 4px;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid var(--text-3);
      background: transparent;
      transition: all 140ms ease-out;
    }

    .page-dot.active {
      border-color: var(--text-1);
      background: var(--text-1);
    }

    .quick-list {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quick-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius-lg);
      background: transparent;
      border: 1px solid transparent;
      transition: all 140ms cubic-bezier(.16,1,.3,1);
      cursor: pointer;
      color: var(--text-1);
      text-align: left;
      font-family: var(--mono);
      font-size: 13px;
    }

    .quick-item:hover {
      background: var(--bg-hover);
      border-color: var(--hairline);
    }

    .quick-item.selected {
      background: transparent;
      border-color: var(--text-2);
      border-width: 2px;
      padding: 7px 11px;
    }

    .number {
      width: 16px;
      color: var(--text-3);
      font-weight: 650;
      text-align: center;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--hairline);
      flex-shrink: 0;
    }

    .summary {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-footer {
      padding: 6px;
      border-top: 2px solid var(--hairline);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-button {
      width: 100%;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-1);
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 140ms ease-out;
    }

    .nav-button:hover {
      background: var(--bg-hover);
      border-color: var(--hairline);
    }

    .nav-button.primary {
      background: transparent;
      color: var(--action);
      border-color: var(--action);
      font-weight: 600;
    }

    .nav-button.primary:hover {
      background: var(--action);
      color: var(--action-on);
    }

    /* HistoryWorkspace Demo */
    .history-panel {
      background: var(--bg-shell);
      border-radius: var(--radius-xl);
      border: 2px solid var(--hairline);
      display: grid;
      grid-template-columns: 300px 1fr;
      grid-template-rows: 42px 1fr 48px;
      height: 500px;
      overflow: hidden;
    }

    .app-titlebar {
      grid-column: 1 / -1;
      background: var(--bg-raised);
      border-bottom: 2px solid var(--hairline);
      display: flex;
      align-items: center;
      padding: 0 12px;
      justify-content: space-between;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .titlebar-left svg {
      width: 18px;
      height: 18px;
    }

    .search-bar {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-1);
      font-family: var(--mono);
      font-size: 13px;
      padding: 0 8px;
    }

    .history-list {
      background: var(--bg-raised);
      border-right: 2px solid var(--hairline);
      padding: 8px;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px;
      border-radius: var(--radius-lg);
      margin-bottom: 4px;
      background: transparent;
      border: 1px solid transparent;
      transition: all 140ms ease-out;
      cursor: pointer;
    }

    .history-item:hover {
      background: var(--bg-hover);
      border-color: var(--hairline);
    }

    .history-item.selected {
      background: transparent;
      border-color: var(--text-2);
      border-width: 2px;
      padding: 9px;
    }

    .item-preview {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-1);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      font-size: 11px;
      color: var(--text-3);
      font-family: var(--mono);
    }

    .preview-pane {
      padding: 20px;
      overflow-y: auto;
    }

    .preview-content {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-1);
      border-left: 2px solid var(--hairline);
      padding-left: 16px;
    }

    .action-bar {
      grid-column: 1 / -1;
      background: var(--bg-raised);
      border-top: 2px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
    }

    .action-button {
      height: 32px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 140ms ease-out;
    }

    .action-button.primary {
      background: transparent;
      color: var(--action);
      border-color: var(--action);
    }

    .action-button.primary:hover {
      background: var(--action);
      color: var(--action-on);
    }

    .action-button.ghost {
      background: transparent;
      color: var(--text-2);
      border-color: transparent;
    }

    .action-button.ghost:hover {
      background: var(--bg-hover);
      color: var(--text-1);
      border-color: var(--hairline);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <h1>方向B：极简线条风</h1>
    <p class="subtitle">扁平背景 + 强化边框 + 线条图标 + Wireframe美学</p>

    <div class="quick-panel">
      <div class="header">
        <span class="brand">
          <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <strong>ClipClop</strong>
        </span>
        <div class="navigation">
          <div class="page-dots">
            <span class="page-dot active"></span>
            <span class="page-dot"></span>
            <span class="page-dot"></span>
          </div>
          <span>1/3</span>
        </div>
      </div>

      <div class="quick-list">
        <button class="quick-item selected">
          <span class="number">1</span>
          <span class="summary">Hello World from VSCode</span>
        </button>
        <button class="quick-item">
          <span class="number">2</span>
          <span class="swatch" style="background: #3b82f6;"></span>
          <span class="summary">#3b82f6</span>
        </button>
        <button class="quick-item">
          <span class="number">3</span>
          <span class="summary">https://github.com/user/repo</span>
        </button>
        <button class="quick-item">
          <span class="number">4</span>
          <span class="summary">export const config = { theme: 'dark' }</span>
        </button>
        <button class="quick-item">
          <span class="number">5</span>
          <span class="summary">document.png · 2.4MB</span>
        </button>
      </div>

      <div class="nav-footer">
        <button class="nav-button primary">
          <span>打开历史记录</span>
        </button>
        <button class="nav-button">
          <span>设置</span>
          <span style="color: var(--text-3); font-size: 11px;">⌘,</span>
        </button>
      </div>
    </div>

    <div class="history-panel">
      <div class="app-titlebar">
        <div class="titlebar-left">
          <svg width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <strong style="font-size: 13px;">剪贴板历史</strong>
        </div>
        <input type="search" class="search-bar" placeholder="搜索内容...">
      </div>

      <div class="history-list">
        <div class="history-item selected">
          <div class="item-preview">Hello World from VSCode</div>
          <div class="item-meta">文本 · 刚刚</div>
        </div>
        <div class="history-item">
          <div class="item-preview">#3b82f6</div>
          <div class="item-meta">颜色 · 2分钟前</div>
        </div>
        <div class="history-item">
          <div class="item-preview">https://github.com/user/repo</div>
          <div class="item-meta">链接 · 5分钟前</div>
        </div>
        <div class="history-item">
          <div class="item-preview">export const config = { ... }</div>
          <div class="item-meta">代码 · 10分钟前</div>
        </div>
      </div>

      <div class="preview-pane">
        <div class="preview-content">
          Hello World from VSCode<br><br>
          这是极简线条风格，所有深度通过边框而非填充表达，背景层次被压缩到最少。
        </div>
      </div>

      <div class="action-bar">
        <div style="display: flex; gap: 8px;">
          <button class="action-button ghost">预览</button>
          <button class="action-button ghost">删除</button>
        </div>
        <button class="action-button primary">复制并粘贴</button>
      </div>
    </div>
  </div>
</body>
</html>
