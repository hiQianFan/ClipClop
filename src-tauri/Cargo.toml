[package]
name = "clipclop"
version = "0.2.1"
description = "A lightweight, offline-first, cross-platform clipboard history tool."
edition = "2021"
license = "MIT"
repository = "https://github.com/hiQianFan/ClipClop"
homepage = "https://github.com/hiQianFan/ClipClop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipclop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
clipboard-rs = "0.3.5"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-global-shortcut = "2"
active-win-pos-rs = "0.11"
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
appkit-nsworkspace-bindings = "0.1.2"
core-foundation = "0.10"
objc = "0.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
tauri-plugin-quicklook = "0.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
