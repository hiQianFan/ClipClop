name: Deploy Download Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-downloads
    steps:
      - uses: actions/checkout@v5
      - name: Deploy download redirects
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DOWNLOAD_WORKER_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.127.1"
          command: deploy --config cloudflare/wrangler.toml
