name: Sync Releases JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: releases-json-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Generate releases JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-releases-json.mjs .release-assets/releases.json
      - name: Upload releases JSON to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_RELEASES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_RELEASES_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: aws s3 cp .release-assets/releases.json s3://clipclop-releases/releases.json --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "public, max-age=300"
