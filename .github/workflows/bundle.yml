name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (must match package, Cargo, and Tauri versions; for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    environment: production-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action updates a shared latest.json; serialize platforms to avoid lost updates.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Universal DMG
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # The app target produces the signed .app.tar.gz updater artifact;
            # dmg alone is installable but is not an updater-enabled target.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64 Setup
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.3
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          app_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          release_version="${MANUAL_VERSION#v}"
          test -n "$release_version"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$release_version" = "$app_version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$app_version"
          test "$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).packages[0].version))")" = "$app_version"
      - name: Frontend tests
        run: pnpm test
      - name: Frontend diagnostics
        run: pnpm check
      - name: Frontend production build
        run: pnpm build
      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Protect published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version="$(node -p "require('./package.json').version")"
          if release_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$app_version" --jq .draft 2>/dev/null)"; then
            test "$release_draft" = "true"
          fi
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ClipClop v__VERSION__ Preview
          releaseBody: |
            See CHANGELOG.md for release notes.

            Preview installation note: these installers are not currently signed with Apple Developer ID or Windows Authenticode. macOS may require approval in Privacy & Security, and Windows may show an Unknown Publisher or SmartScreen warning. Tauri updater signatures verify update integrity but do not provide operating-system publisher identity.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

  verify:
    name: Verify Draft Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # GitHub hides draft releases from tokens without release write access.
      # This job only reads the draft and downloads latest.json.
      contents: write
    steps:
      - name: Verify assets and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          release_version="${MANUAL_VERSION#v}"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$release_version")"
          test "$(jq -r .draft <<<"$release_json")" = "true"

          asset_names="$(jq -r '.assets[].name' <<<"$release_json")"
          for asset in \
            "ClipClop_${release_version}_universal.dmg" \
            "ClipClop_universal.app.tar.gz" \
            "ClipClop_universal.app.tar.gz.sig" \
            "ClipClop_${release_version}_x64-setup.exe" \
            "ClipClop_${release_version}_x64-setup.exe.sig" \
            "latest.json"; do
            grep -Fxq "$asset" <<<"$asset_names"
          done

          manifest_dir="$(mktemp -d)"
          gh release download "v$release_version" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          jq -e --arg version "$release_version" '
            . as $manifest
            | .version == $version
            and ([
              "darwin-aarch64",
              "darwin-x86_64",
              "windows-x86_64",
              "windows-x86_64-nsis"
            ] | all(. as $platform |
              ($manifest.platforms[$platform].url | length > 0)
              and ($manifest.platforms[$platform].signature | length > 0)
            ))
          ' "$manifest_dir/latest.json"
