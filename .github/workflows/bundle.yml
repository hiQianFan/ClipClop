name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (must match package, Cargo, and Tauri versions; for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.version.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          app_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          release_version="${MANUAL_VERSION#v}"
          test -n "$release_version"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$release_version" = "$app_version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$app_version"
          test "$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).packages[0].version))")" = "$app_version"
          release_notes_file="docs/release-notes/v$release_version.md"
          test -s "$release_notes_file"
          release_body="$(cat "$release_notes_file")"
          if [[ -s docs/release-notes/_installation-note.md ]]; then
            release_body+=$'\n\n---\n\n'
            release_body+="$(cat docs/release-notes/_installation-note.md)"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v$release_version\")" | head -n 1)"
          if [[ -n "$release_json" ]]; then
            test "$(jq -r .draft <<<"$release_json")" = "true"
            release_id="$(jq -r .id <<<"$release_json")"
          else
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$release_version" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="ClipClop v$release_version Preview" \
              -f body="$release_body" \
              -F draft=true -F prerelease=false -F generate_release_notes=true --jq .id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    environment: production-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal DMG
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # The app target produces the signed .app.tar.gz updater artifact;
            # dmg alone is installable but is not an updater-enabled target.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64 Setup
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 9.15.3
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Frontend diagnostics
        run: pnpm check
      - name: Frontend production build
        run: pnpm build
      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: v__VERSION__
          releaseDraft: true
          updaterJsonPreferNsis: true
          # latest.json has exactly one writer in finalize; matrix jobs only upload platform assets.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  finalize:
    name: Finalize and Verify Draft Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      # GitHub hides draft releases from tokens without release write access.
      # This job only reads the draft and downloads latest.json.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Generate updater manifest and verify release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r .draft <<<"$release_json")" = "true"

          asset_names="$(jq -r '.assets[].name' <<<"$release_json")"
          for asset in \
            "ClipClop_${RELEASE_VERSION}_universal.dmg" \
            "ClipClop_universal.app.tar.gz" \
            "ClipClop_universal.app.tar.gz.sig" \
            "ClipClop_${RELEASE_VERSION}_x64-setup.exe" \
            "ClipClop_${RELEASE_VERSION}_x64-setup.exe.sig"; do
            grep -Fxq "$asset" <<<"$asset_names"
          done

          manifest_dir="$GITHUB_WORKSPACE/.release-assets"
          mkdir -p "$manifest_dir"
          download_asset() {
            local asset_name="$1"
            local asset_api_url
            asset_api_url="$(
              jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .url' \
                <<<"$release_json"
            )"
            test -n "$asset_api_url"
            gh api \
              --header "Accept: application/octet-stream" \
              "$asset_api_url" > "$manifest_dir/$asset_name"
          }

          mac_installer="ClipClop_${RELEASE_VERSION}_universal.dmg"
          mac_bundle="ClipClop_universal.app.tar.gz"
          mac_signature="$mac_bundle.sig"
          windows_bundle="ClipClop_${RELEASE_VERSION}_x64-setup.exe"
          windows_signature="$windows_bundle.sig"
          download_asset "$mac_installer"
          download_asset "$mac_bundle"
          download_asset "$mac_signature"
          download_asset "$windows_bundle"
          download_asset "$windows_signature"

          mac_manifest_signature="$(tr -d '\r\n' < "$manifest_dir/$mac_signature")"
          windows_manifest_signature="$(tr -d '\r\n' < "$manifest_dir/$windows_signature")"
          release_base="https://clipclop.mapin.net/releases/v$RELEASE_VERSION"
          release_notes_file="docs/release-notes/v$RELEASE_VERSION.md"
          test -s "$release_notes_file"
          release_notes="$(cat "$release_notes_file")"
          if [[ -s docs/release-notes/_installation-note.md ]]; then
            release_notes+=$'\n\n---\n\n'
            release_notes+="$(cat docs/release-notes/_installation-note.md)"
          fi
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg notes "$release_notes" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg mac_url "$release_base/ClipClop_${RELEASE_VERSION}_macos_universal.app.tar.gz" \
            --arg mac_sig "$mac_manifest_signature" \
            --arg win_url "$release_base/ClipClop_${RELEASE_VERSION}_windows_x64-setup.exe" \
            --arg win_sig "$windows_manifest_signature" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{
              "darwin-aarch64":{signature:$mac_sig,url:$mac_url},
              "darwin-x86_64":{signature:$mac_sig,url:$mac_url},
              "windows-x86_64":{signature:$win_sig,url:$win_url},
              "windows-x86_64-nsis":{signature:$win_sig,url:$win_url}
            }}' > "$manifest_dir/latest.json"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg macos "/releases/v$RELEASE_VERSION/$mac_installer" \
            --arg windows "/releases/v$RELEASE_VERSION/ClipClop_${RELEASE_VERSION}_windows_x64-setup.exe" \
            '{version:$version,macos:$macos,windows:$windows}' > "$manifest_dir/downloads.json"

          jq -e --arg version "$RELEASE_VERSION" '
            . as $manifest
            | .version == $version and (["darwin-aarch64","darwin-x86_64","windows-x86_64","windows-x86_64-nsis"]
              | all(. as $platform | ($manifest.platforms[$platform].url | length > 0) and ($manifest.platforms[$platform].signature | length > 0)))
          ' "$manifest_dir/latest.json"
          jq -e --arg version "$RELEASE_VERSION" '
            .version == $version
            and (.macos | startswith("/releases/v" + $version + "/"))
            and (.windows | startswith("/releases/v" + $version + "/"))
          ' "$manifest_dir/downloads.json"

          updater_pubkey="$(
            jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json \
              | base64 --decode \
              | awk '/^RW/ { print; exit }'
          )"
          test -n "$updater_pubkey"
          base64 --decode < "$manifest_dir/$mac_signature" > "$manifest_dir/$mac_signature.decoded"
          base64 --decode < "$manifest_dir/$windows_signature" > "$manifest_dir/$windows_signature.decoded"
          minisign -Vm "$manifest_dir/$mac_bundle" -x "$manifest_dir/$mac_signature.decoded" -P "$updater_pubkey"
          minisign -Vm "$manifest_dir/$windows_bundle" -x "$manifest_dir/$windows_signature.decoded" -P "$updater_pubkey"

      - name: Upload versioned release files to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: |
            r2 object put clipclop-releases/releases/v${{ needs.prepare.outputs.version }}/ClipClop_${{ needs.prepare.outputs.version }}_universal.dmg --file=.release-assets/ClipClop_${{ needs.prepare.outputs.version }}_universal.dmg --content-type=application/x-apple-diskimage --content-disposition='attachment; filename="ClipClop_${{ needs.prepare.outputs.version }}_universal.dmg"' --cache-control="public, max-age=31536000, immutable"
            r2 object put clipclop-releases/releases/v${{ needs.prepare.outputs.version }}/ClipClop_${{ needs.prepare.outputs.version }}_macos_universal.app.tar.gz --file=.release-assets/ClipClop_universal.app.tar.gz --content-type=application/gzip --cache-control="public, max-age=31536000, immutable"
            r2 object put clipclop-releases/releases/v${{ needs.prepare.outputs.version }}/ClipClop_${{ needs.prepare.outputs.version }}_macos_universal.app.tar.gz.sig --file=.release-assets/ClipClop_universal.app.tar.gz.sig --content-type=text/plain --cache-control="public, max-age=31536000, immutable"
            r2 object put clipclop-releases/releases/v${{ needs.prepare.outputs.version }}/ClipClop_${{ needs.prepare.outputs.version }}_windows_x64-setup.exe --file=.release-assets/ClipClop_${{ needs.prepare.outputs.version }}_x64-setup.exe --content-type=application/vnd.microsoft.portable-executable --content-disposition='attachment; filename="ClipClop_${{ needs.prepare.outputs.version }}_windows_x64-setup.exe"' --cache-control="public, max-age=31536000, immutable"
            r2 object put clipclop-releases/releases/v${{ needs.prepare.outputs.version }}/ClipClop_${{ needs.prepare.outputs.version }}_windows_x64-setup.exe.sig --file=.release-assets/ClipClop_${{ needs.prepare.outputs.version }}_x64-setup.exe.sig --content-type=text/plain --cache-control="public, max-age=31536000, immutable"
            r2 object put clipclop-releases/downloads.json --file=.release-assets/downloads.json --content-type=application/json --cache-control="no-cache"
            r2 object put clipclop-releases/latest.json --file=.release-assets/latest.json --content-type=application/json --cache-control="no-cache"
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v$RELEASE_VERSION" ".release-assets/latest.json#latest.json" --clobber
          gh release edit "v$RELEASE_VERSION" \
            --draft=false \
            --prerelease=false \
            --title "ClipClop v$RELEASE_VERSION"
