<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClipClop 更新交互 Demo</title>
  <style>
    /* Governed by existing ClipClop tokens; evaluates staged updater actions only. */
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark;--page:#0d0e0f;--shell:#17181a;--raised:#1e2022;--hover:#242628;--selected:#2a2d30;--line:#2c2f32;--t1:#ecedee;--t2:#aeb3b7;--t3:#8a9095;--action:#eceef0;--on:#17181a;--danger:#ff6b72;--r4:4px;--r6:6px;--r8:8px;--r14:14px;--shadow:0 2px 5px rgba(0,0,0,.18),0 18px 50px rgba(0,0,0,.45)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px;display:grid;place-items:center;color:var(--t1);background:radial-gradient(circle at 50% 0,#25282b 0,transparent 42%),var(--page)}button{border:0;font:inherit}.demo{width:min(1080px,100%)}.top{margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.top h1{margin:0 0 4px;font-size:18px}.top p{margin:0;color:var(--t2);font-size:12px}.states{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--shell)}.states button{padding:7px 9px;border-radius:5px;color:var(--t2);background:transparent;font-size:11px;cursor:pointer}.states button:hover,.states button.active{color:var(--t1);background:var(--selected)}.layout{display:grid;grid-template-columns:minmax(0,840px) 220px;gap:18px}.window{height:640px;overflow:hidden;border:1px solid #303337;border-radius:var(--r14);background:var(--shell);box-shadow:var(--shadow)}.titlebar{height:42px;padding:0 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--raised);font-size:12px;font-weight:650}.mark{width:19px;height:19px;display:grid;place-items:center;border-radius:5px;color:white;background:linear-gradient(145deg,#e56f67,#7b58d3);font-size:10px}.settings{height:550px;display:grid;grid-template-columns:180px 1fr}.nav{padding:14px 12px;border-right:1px solid var(--line)}.nav button{width:100%;height:40px;padding:0 12px;border-radius:var(--r6);color:var(--t2);background:transparent;text-align:left;font-size:13px;font-weight:600}.nav button.active{color:var(--t1);background:var(--selected)}.nav hr{height:1px;margin:8px 6px;border:0;background:var(--line)}.content{min-width:0;padding:0 24px 20px}.content h2{margin:18px 0 4px;font-size:18px}.head{min-height:68px;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}.head>span,.card-title{display:flex;min-width:0;flex-direction:column;gap:3px}.head strong,.card strong{font-size:13px}.head small,.card small{color:var(--t3);font-size:12px}.toggle{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:12px}.switch{width:36px;height:20px;padding:2px;border-radius:999px;background:var(--action)}.switch:after{content:"";display:block;width:16px;height:16px;margin-left:16px;border-radius:50%;background:var(--on)}.tools{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.status{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:12px}.tool-actions,.actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.ghost,.primary,.quiet{min-height:32px;padding:0 12px;border-radius:var(--r6);cursor:pointer;font-size:12px}.ghost{color:var(--t2);background:transparent}.ghost:hover,.quiet:hover{color:var(--t1);background:var(--hover)}.primary{color:var(--on);background:var(--action);font-weight:600}.quiet{color:var(--t3);background:transparent}.card{margin-top:16px;padding:16px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:var(--r8);background:var(--raised)}.card-head{display:flex;align-items:center;gap:12px}.badge{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:var(--r8);color:var(--on);background:var(--action);font-size:17px}.progress-wrap{display:flex;flex-direction:column;gap:7px}.track{height:6px;overflow:hidden;border-radius:999px;background:var(--selected)}.fill{width:0;height:100%;border-radius:999px;background:var(--action);transition:width .2s}.progress-label,.message{margin:0;color:var(--t2);font-size:12px}.message.error{color:var(--danger)}.release{height:208px;margin-top:16px;display:grid;grid-template-columns:168px 1fr;overflow:hidden}.versions{padding-right:8px;border-right:1px solid var(--line)}.version{height:36px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--r8);font-size:11px}.version.active{background:var(--selected)}.version span{color:var(--t3)}.notes{padding-left:14px}.notes h3{margin:5px 0 10px;font-size:13px}.notes-body{height:158px;padding:10px 12px;border-radius:var(--r6);color:var(--t2);background:var(--shell);font-size:11px;line-height:1.55}.notes-body b{color:var(--t1)}.footer{height:48px;padding:0 16px;display:flex;justify-content:flex-end;align-items:center;gap:10px;border-top:1px solid var(--line)}.footer button{min-width:92px;height:32px;border-radius:var(--r6);color:var(--t2);background:transparent}.footer .save{color:var(--on);background:var(--action)}.side{display:flex;flex-direction:column;gap:10px}.callout{padding:12px;border:1px solid var(--line);border-radius:var(--r8);background:var(--shell)}.callout b{display:block;margin-bottom:5px;font-size:12px}.callout p{margin:0;color:var(--t2);font-size:11px;line-height:1.55}.flow{padding:12px;border:1px solid var(--line);border-radius:var(--r8);background:var(--raised);font-size:11px}.flow span{display:block;padding:7px 8px;border-radius:5px;color:var(--t2)}.flow span.active{color:var(--t1);background:var(--selected)}.flow i{display:block;margin-left:18px;color:var(--t3);font-style:normal}.hidden{display:none!important}@media(max-width:940px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr)}.window{height:620px}.settings{grid-template-columns:150px 1fr}}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
    /* Compact updater: status owns the width; one short action stays protected at right. */
    .tool-actions{gap:4px}.ghost,.primary,.more{height:28px;min-height:0;border-radius:var(--r6);cursor:pointer;font-size:11px}.ghost{padding:0 9px}.primary{width:88px;padding:0 8px;white-space:nowrap}.card{position:relative;height:106px;margin-top:12px;padding:12px 12px 12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 122px;align-items:center;gap:18px}.card-main{min-width:0;display:grid;grid-template-rows:32px 14px 16px;align-content:center;gap:5px}.compact-actions{position:relative;width:122px;display:grid;grid-template-columns:28px 88px;align-items:center;gap:6px}.more{width:28px;padding:0;color:var(--t3);background:transparent}.more:hover,.more[aria-expanded="true"]{color:var(--t1);background:var(--hover)}.more-menu{position:absolute;right:0;top:32px;z-index:2;width:128px;padding:4px;border:1px solid var(--line);border-radius:var(--r6);background:var(--raised);box-shadow:0 6px 8px rgba(0,0,0,.25)}.more-menu button{width:100%;height:28px;padding:0 8px;border-radius:4px;color:var(--t2);background:transparent;text-align:left;font-size:11px;cursor:pointer}.more-menu button:hover{color:var(--t1);background:var(--hover)}.progress-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}.progress-wrap.hidden{display:grid!important;visibility:hidden}.message.hidden{display:block!important;visibility:hidden}.compact-actions>.more.hidden{display:block!important;visibility:hidden}.track{height:4px}.progress-label{min-width:70px;text-align:right;font-size:11px}.message{overflow:hidden;font-size:11px;white-space:nowrap;text-overflow:ellipsis}.release{height:230px;margin-top:14px}.notes-body{height:180px}
    /* The page has one updater surface: a fixed rail above the release browser. */
    .update-rail{height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border-bottom:1px solid var(--line)}.rail-main{min-width:0;display:flex;align-items:center;gap:12px}.rail-title{display:block;flex:none;max-width:210px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rail-title strong{font-size:13px}.rail-detail{position:relative;height:20px;min-width:0;flex:1}.rail-detail .progress-wrap,.rail-detail .message{position:absolute;inset:0}.rail-detail .progress-wrap{height:20px;grid-template-columns:minmax(80px,1fr) 38px;gap:8px}.rail-detail .progress-label{width:38px;min-width:38px}.rail-detail .message{height:20px;overflow:hidden;line-height:20px;white-space:nowrap;text-overflow:ellipsis}.rail-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.rail-actions>.skip.hidden,.rail-actions>.primary.hidden{display:none!important}.skip{width:88px;height:28px;padding:0 8px;border-radius:var(--r6);color:var(--t3);background:transparent;font-size:11px;white-space:nowrap;cursor:pointer}.skip:hover{color:var(--t1);background:var(--hover)}.refresh{position:relative;width:28px;height:28px;padding:0;border-radius:var(--r6);color:var(--t2);background:transparent;cursor:pointer}.refresh:hover{color:var(--t1);background:var(--hover)}.refresh:before{content:"";position:absolute;inset:-8px}.release{height:284px;margin-top:14px}.notes-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.notes-head h3{margin:5px 0 10px}.release-link{padding:4px 6px;color:var(--t3);background:transparent;font-size:11px;cursor:pointer}.release-link:hover{color:var(--t1);background:var(--hover)}.notes-body{height:234px}
  </style>
</head>
<body>
  <main class="demo">
    <header class="top">
      <div><h1>软件更新交互方案</h1><p>每个状态只保留一个主动作；“跳过此版本”始终是低权重决定。</p></div>
      <nav class="states" aria-label="更新状态">
        <button data-state="current">已是最新</button><button data-state="available" class="active">发现更新</button><button data-state="downloading">下载中</button><button data-state="downloaded">下载完成</button><button data-state="download-error">下载失败</button><button data-state="install-error">安装失败</button><button data-state="relaunch-error">重启失败</button>
      </nav>
    </header>
    <section class="layout">
      <div class="window">
        <div class="titlebar"><span class="mark">C</span>ClipClop</div>
        <div class="settings">
          <nav class="nav"><button>通用</button><button>历史记录</button><button>外观</button><button>快捷键</button><hr><button class="active">软件更新</button><button>关于</button></nav>
          <section class="content" aria-live="polite">
            <h2>软件更新</h2>
            <section aria-label="更新设置与状态">
            <div class="head"><span><strong>自动检查更新</strong><small>当前版本 0.7.2</small></span><div class="toggle"><button type="button" class="refresh" aria-label="立即检查更新" title="立即检查更新">↻</button><button type="button" class="switch" role="switch" aria-checked="true" aria-label="自动检查更新"></button></div></div>
            <div class="update-rail" aria-label="更新状态">
              <div class="rail-main">
                <span class="rail-title"><strong id="rail-title">发现新版本 0.7.3</strong></span>
                <div class="rail-detail">
                  <div id="progress" class="progress-wrap hidden"><div class="track"><div id="fill" class="fill"></div></div><span id="progress-label" class="progress-label"></span></div>
                  <p id="message" class="message hidden"></p>
                </div>
              </div>
              <div class="rail-actions">
                <button id="skip" class="skip">跳过此版本</button>
                <button id="primary" class="primary">下载</button>
              </div>
            </div>
            </section>
            <section class="release"><div class="versions"><div class="version active"><b>0.7.3</b><span>今天</span></div><div class="version"><b>0.7.2</b><span>8月28日</span></div><div class="version"><b>0.7.1</b><span>8月26日</span></div></div><div class="notes"><div class="notes-head"><h3>0.7.3</h3><button class="release-link">查看发布页 ↗</button></div><div class="notes-body"><b>改进</b><br>• Windows 可选 PowerToys Peek 文件预览<br>• 更新下载和安装流程更清晰<br><br><b>修复</b><br>• 修复多窗口主题同步问题</div></div></section>
          </section>
        </div>
        <footer class="footer"><button>返回</button><button class="save">保存</button></footer>
      </div>
      <aside class="side">
        <div class="callout"><b>所有状态只占一行</b><p id="explanation">标题、状态详情和操作沿同一条水平轨道排列，切换时不改变高度。</p></div>
        <div class="flow"><span id="flow-a" class="active">1　下载更新</span><i>↓</i><span id="flow-b">2　安装并重启</span></div>
        <div class="callout"><b>版本记录成为页面主体</b><p>发布页入口跟随当前版本详情，不再占用更新操作区域。</p></div>
      </aside>
    </section>
  </main>
  <script>
    const states={
      current:{title:"已是最新版本",primary:"",skip:false,message:"上次检查：今天 14:32",progress:null,explain:"没有可跳过的目标版本，因此不显示版本操作。",step:1},
      available:{title:"发现新版本 0.7.3",primary:"下载",skip:true,message:"",progress:null,explain:"跳过是当前版本的次要动作，直接与下载并列，不藏进更多菜单。",step:1},
      downloading:{title:"正在下载 0.7.3",primary:"取消",skip:false,message:"",progress:42,explain:"下载进行中不能直接跳过；取消后会回到可跳过状态。",step:1},
      downloaded:{title:"0.7.3 已下载",primary:"安装并重启",skip:true,message:"",progress:null,explain:"尚未安装时仍可跳过，已下载的安装包会被丢弃。",step:2},
      "download-error":{title:"下载失败",primary:"重试",skip:true,message:"请检查网络连接",progress:null,error:true,explain:"下载失败后允许用户重试或放弃这个版本。",step:1},
      "install-error":{title:"安装失败",primary:"重试",skip:true,message:"安装包仍然保留",progress:null,error:true,explain:"安装尚未成功时仍允许放弃这个版本。",step:2},
      "relaunch-error":{title:"未能重新启动",primary:"重启",skip:false,message:"更新已安装",progress:null,error:true,explain:"更新已经安装，不能再跳过，只能重新启动。",step:2}
    };
    const buttons=[...document.querySelectorAll('[data-state]')],railTitle=document.querySelector('#rail-title'),primary=document.querySelector('#primary'),skip=document.querySelector('#skip'),message=document.querySelector('#message'),progress=document.querySelector('#progress'),fill=document.querySelector('#fill'),label=document.querySelector('#progress-label'),explain=document.querySelector('#explanation'),a=document.querySelector('#flow-a'),b=document.querySelector('#flow-b');
    function show(name){const x=states[name];buttons.forEach(v=>v.classList.toggle('active',v.dataset.state===name));railTitle.textContent=x.title;railTitle.classList.toggle('error',!!x.error);primary.textContent=x.primary;primary.classList.toggle('hidden',!x.primary);skip.classList.toggle('hidden',!x.skip);message.textContent=x.message;message.classList.toggle('hidden',!x.message);progress.classList.toggle('hidden',x.progress===null);fill.style.width=(x.progress??0)+'%';label.textContent=x.progress===100?'下载完成':`${x.progress}%`;explain.textContent=x.explain;a.classList.toggle('active',x.step===1);b.classList.toggle('active',x.step===2)}
    buttons.forEach(v=>v.addEventListener('click',()=>show(v.dataset.state)));
  </script>
</body>
</html>
